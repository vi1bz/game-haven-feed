name: Update game feed

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build games.json
        run: python3 build_feed.py

      - name: Save changes
        run: |
          git config user.name "game-haven-bot"
          git config user.email "game-haven-bot@users.noreply.github.com"
          git add games.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update games.json"
            git push
          fi
