name: Update game feed

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build games.json
        run: python3 build_feed.py

      - name: Save changes
        run: |
          git config user.name "game-haven-bot"
          git config user.email "game-haven-bot@users.noreply.github.com"
          git add games.json
          if [ -f state.json ]; then git add state.json; fi
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
